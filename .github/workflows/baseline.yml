name: Windows baseline
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: [self-hosted, Windows, X64, hc-qt612-vc2026]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Preserve local runner configuration; licensed sources come from submodules.
          clean: false
          persist-credentials: false
      - name: Initialize licensed nested submodules
        shell: powershell
        run: |
          # The self-hosted runner supplies read access to the private Qtitan repo.
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test with the qualified Qt kit
        shell: powershell
        run: |
          $Kit = 'D:\Qt\Qt-6.12.0-VC2026-X64-H-MD-2026-09-04\bin\qt-cmake.bat'
          $BuildDir = Join-Path $PWD ('_build/ci-' + [Guid]::NewGuid().ToString('N'))
          & $Kit --preset vc2026-qt612 -B $BuildDir -DBUILD_TESTING=ON -DHC_ENABLE_LOCAL_TEST_TOOLS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($Config in @('Debug', 'Release')) {
            & $Kit --build $BuildDir --config $Config --target hc_check --parallel 6
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
